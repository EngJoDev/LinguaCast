    <script>
        function handleFileSelect(event) {
            const input = event.target;
            if (input.files && input.files[0]) {
                document.getElementById('uploadStateEmpty').style.display = 'none';
                document.getElementById('uploadStateSuccess').style.display = 'flex';
                document.getElementById('selectedFileName').innerText = input.files[0].name;
            }
        }

        function selectGender(gender) {
            document.getElementById('selectedGender').value = gender;
            const maleCard = document.getElementById('cardMale');
            const femaleCard = document.getElementById('cardFemale');
            if (gender === 'male') {
                maleCard.className = "cursor-pointer bg-blue-600/20 border-2 border-blue-500 text-blue-300 rounded-2xl p-4 flex flex-col items-center justify-center gap-2";
                femaleCard.className = "cursor-pointer bg-black/40 border-2 border-gray-700 text-gray-500 rounded-2xl p-4 flex flex-col items-center justify-center gap-2";
            } else {
                femaleCard.className = "cursor-pointer bg-pink-600/20 border-2 border-pink-500 text-pink-300 rounded-2xl p-4 flex flex-col items-center justify-center gap-2";
                maleCard.className = "cursor-pointer bg-black/40 border-2 border-gray-700 text-gray-500 rounded-2xl p-4 flex flex-col items-center justify-center gap-2";
            }
        }

        async function startProcess() {
            const fileInput = document.getElementById('videoFile');
            if (!fileInput.files || fileInput.files.length === 0) {
                alert('⚠️ اختر فيديو أولاً!');
                return;
            }

            document.getElementById('submitBtn').style.display = 'none';
            document.getElementById('loadingBox').style.display = 'block';
            document.getElementById('resultBox').style.display = 'none';

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);
            formData.append('target_lang', document.getElementById('targetLang').value);
            formData.append('gender', document.getElementById('selectedGender').value);

            try {
                const response = await fetch('/api/ml/upload-and-dub-stream', { method: 'POST', body: formData });
                const reader = response.body.getReader();
                const decoder = new TextDecoder();

                while (true) {
                    const { value, done } = await reader.read();
                    if (done) break;
                    const lines = decoder.decode(value).split('\n');
                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            try {
                                const data = JSON.parse(line.replace('data: ', '').trim());
                                if (data.status === 'progress') {
                                    document.getElementById('progressBar').style.width = data.percent + '%';
                                    document.getElementById('progressPercent').innerText = data.percent + '%';
                                    document.getElementById('loadingText').innerText = data.message;
                                } else if (data.status === 'success') {
                                    document.getElementById('outputVideo').src = data.output_url;
                                    document.getElementById('downloadBtn').href = data.output_url;
                                    document.getElementById('loadingBox').style.display = 'none';
                                    document.getElementById('resultBox').style.display = 'block';
                                    if (typeof confetti === 'function') confetti({ particleCount: 200 });
                                }
                            } catch(e) {}
                        }
                    }
                }
            } catch (err) {
                alert('حدث خطأ: ' + err.message);
                document.getElementById('submitBtn').style.display = 'flex';
                document.getElementById('loadingBox').style.display = 'none';
            }
        }
    </script>
