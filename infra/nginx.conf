events {}

http {
    client_max_body_size 4G;

    proxy_connect_timeout 2700s;
    proxy_send_timeout    2700s;
    proxy_read_timeout    2700s;
    client_body_timeout   2700s;
    send_timeout          2700s;

    server {
        listen 80;

        location /api/ {
            # 🌟 التعديل السحري: شيلنا الشرطة اللي في الآخر هنا عشان الـ المسار يروح كامل (/api/dub)
            proxy_pass http://backend-api:5000;
            
            proxy_read_timeout 2700s;
            proxy_connect_timeout 2700s;
            proxy_send_timeout 2700s;
        }

        location / {
            proxy_pass http://frontend:80/;
        }
    }
}
