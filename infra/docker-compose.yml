
services:
  ml-service:
    build: ../ml-service
    container_name: ml-service
    ports:
      - "8001:8001"
    volumes:
      - ../storage:/app/storage

  backend-api:
    build: ../backend-api
    container_name: backend-api
    ports:
      - "5000:5000"
    environment:
      - ML_BASE_URL=http://ml-service:8001
    volumes:
      - ../storage:/app/storage  # 🌟 التعديل السحري: ربطنا نفس المجلد المشترك هنا عشان الـ Backend يشوف الفيديوهات والصوتيات
    depends_on:
      - ml-service

  frontend:
    build: ../frontend
    container_name: frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend-api

  nginx:
    image: nginx:latest
    container_name: nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
